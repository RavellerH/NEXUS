<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Knowledge Graph</title>
  <meta name="description" content="Interactive 3D knowledge graph of NEXUS context engine research. Click any node to read the research file.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      color: #e6edf3;
    }

    #graph { width: 100vw; height: 100vh; }

    /* ── Top nav ── */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: rgba(13, 17, 23, 0.82);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(48, 54, 61, 0.6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
    }
    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .top-bar a {
      color: #8b949e;
      text-decoration: none;
      font-size: 13px;
      transition: color 0.15s;
    }
    .top-bar a:hover { color: #58a6ff; }
    .top-bar-title {
      font-size: 14px;
      font-weight: 700;
      color: #e6edf3;
      letter-spacing: 0.02em;
    }
    .top-bar-sep {
      color: #30363d;
    }

    /* ── Legend ── */
    .legend {
      position: fixed;
      bottom: 24px;
      left: 24px;
      background: rgba(22, 27, 34, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(48, 54, 61, 0.7);
      border-radius: 10px;
      padding: 14px 18px;
      z-index: 100;
      min-width: 180px;
    }
    .legend-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8b949e;
      margin-bottom: 10px;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px;
      color: #c9d1d9;
    }
    .legend-row:last-child { margin-bottom: 0; }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Node info panel ── */
    .info-panel {
      position: fixed;
      top: 64px;
      right: 24px;
      width: 280px;
      background: rgba(22, 27, 34, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(48, 54, 61, 0.7);
      border-radius: 10px;
      padding: 18px;
      z-index: 100;
      display: none;
      animation: fadeIn 0.15s ease;
    }
    .info-panel.visible { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .info-panel .info-tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .info-panel h3 {
      font-size: 15px;
      font-weight: 700;
      color: #e6edf3;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .info-panel .info-desc {
      font-size: 12px;
      color: #8b949e;
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .info-panel .info-links {
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 14px;
    }
    .info-panel .info-links span {
      font-weight: 600;
      color: #c9d1d9;
    }
    .open-btn {
      display: block;
      width: 100%;
      padding: 8px 14px;
      background: #1f6feb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.15s;
    }
    .open-btn:hover { background: #388bfd; }
    .open-btn.disabled {
      background: #21262d;
      color: #484f58;
      cursor: default;
      pointer-events: none;
    }
    .close-btn {
      position: absolute;
      top: 12px; right: 14px;
      background: none;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 2px;
    }
    .close-btn:hover { color: #e6edf3; }

    /* ── Hint ── */
    .hint {
      position: fixed;
      bottom: 24px;
      right: 24px;
      font-size: 11px;
      color: #484f58;
      text-align: right;
      z-index: 100;
      line-height: 1.8;
    }

    /* ── Stats ── */
    .stats {
      position: fixed;
      top: 64px;
      left: 24px;
      font-size: 11px;
      color: #484f58;
      z-index: 100;
      line-height: 1.8;
    }
    .stats span { color: #8b949e; }
  </style>
</head>
<body>

<!-- Top bar -->
<div class="top-bar">
  <div class="top-bar-left">
    <a href="index.html">← NEXUS</a>
    <span class="top-bar-sep">|</span>
    <span class="top-bar-title">Knowledge Graph</span>
    <span class="top-bar-sep">|</span>
    <a href="research.html">Research Overview</a>
    <span class="top-bar-sep">|</span>
    <a href="personal.html">Personal AI</a>
  </div>
  <div style="font-size:12px;color:#484f58;">Drag to rotate · Scroll to zoom · Click node to inspect</div>
</div>

<!-- Graph container -->
<div id="graph"></div>

<!-- Stats -->
<div class="stats" id="stats"></div>

<!-- Legend -->
<div class="legend">
  <div class="legend-title">Categories</div>
  <div class="legend-row"><div class="legend-dot" style="background:#bc8cff"></div>Meta / Index</div>
  <div class="legend-row"><div class="legend-dot" style="background:#58a6ff"></div>Foundations</div>
  <div class="legend-row"><div class="legend-dot" style="background:#3fb950"></div>Retrieval Pipeline</div>
  <div class="legend-row"><div class="legend-dot" style="background:#2ea8c4"></div>Models &amp; Storage</div>
  <div class="legend-row"><div class="legend-dot" style="background:#e3b341"></div>Advanced Systems</div>
  <div class="legend-row"><div class="legend-dot" style="background:#f0883e"></div>Application Layer</div>
  <div class="legend-row"><div class="legend-dot" style="background:#ff7b72"></div>Personal Context</div>
</div>

<!-- Node info panel -->
<div class="info-panel" id="infoPanel">
  <button class="close-btn" onclick="closePanel()">×</button>
  <div class="info-tag" id="infoTag"></div>
  <h3 id="infoTitle"></h3>
  <div class="info-desc" id="infoDesc"></div>
  <div class="info-links" id="infoLinks"></div>
  <a class="open-btn" id="infoBtn" href="#" target="_blank">Open Research File</a>
</div>

<!-- Hint -->
<div class="hint">
  Drag · Scroll · Click<br>
  <span id="nodeCount"></span>
</div>

<!-- 3D Force Graph -->
<script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>

<script>
// ─────────────────────────────────────────────────────────────────
// GRAPH DATA
// Nodes: id, label, group (color), desc, url, status
// Groups: 0=meta, 1=foundations, 2=retrieval, 3=models+storage, 4=advanced, 5=application, 6=personal
// ─────────────────────────────────────────────────────────────────
const COLORS = {
  0: '#bc8cff',  // meta
  1: '#58a6ff',  // foundations
  2: '#3fb950',  // retrieval
  3: '#2ea8c4',  // models+storage
  4: '#e3b341',  // advanced
  5: '#f0883e',  // application
  6: '#ff7b72',  // personal (new)
};

const graphData = {
  nodes: [
    {
      id: 'index',
      label: 'Research Index',
      group: 0,
      desc: 'Master index of all context engine research files. Entry point for the Obsidian knowledge graph.',
      url: 'docs/research/INDEX.md',
      status: 'live'
    },
    {
      id: 'overview',
      label: 'Context Engine Overview',
      group: 1,
      desc: 'What a context engine is vs. RAG vs. search vs. knowledge base. The foundational architecture.',
      url: 'docs/research/overview.md',
      status: 'live'
    },
    {
      id: 'retrieval',
      label: 'Retrieval Methods',
      group: 2,
      desc: 'Dense, sparse, hybrid RRF, ColBERT/PLAID. Hybrid RRF achieves 80.8% Recall@10 vs 13.9% dense alone.',
      url: 'docs/research/retrieval.md',
      status: 'live'
    },
    {
      id: 'indexing',
      label: 'Indexing Strategies',
      group: 2,
      desc: 'Fixed-size, semantic chunking, contextual retrieval (Anthropic 2024), hierarchical parent-doc, late chunking.',
      url: 'docs/research/indexing.md',
      status: 'live'
    },
    {
      id: 'reranking',
      label: 'Reranking',
      group: 2,
      desc: 'Cross-encoder reranking — highest-ROI addition. Zerank 2 (1638 ELO), MixedBread large-v2 (57.49 BEIR).',
      url: 'docs/research/reranking.md',
      status: 'live'
    },
    {
      id: 'embeddings',
      label: 'Embedding Models',
      group: 3,
      desc: 'BGE-M3 (self-hosted), Voyage voyage-3-large (commercial), Cohere embed-v4 (multimodal), Harrier-OSS 74.3 MTEB v2.',
      url: 'docs/research/embeddings.md',
      status: 'live'
    },
    {
      id: 'vector-databases',
      label: 'Vector Databases',
      group: 3,
      desc: 'Qdrant (self-hosted production), Pinecone (managed), Weaviate (hybrid native), pgvector (<50M vectors).',
      url: 'docs/research/vector-databases.md',
      status: 'live'
    },
    {
      id: 'graph-rag',
      label: 'Graph RAG',
      group: 4,
      desc: 'Microsoft GraphRAG (+70% comprehensiveness), LightRAG (100× cheaper), Graphiti (temporal). Entity relationship queries.',
      url: 'docs/research/graph-rag.md',
      status: 'live'
    },
    {
      id: 'memory',
      label: 'Memory Systems',
      group: 4,
      desc: '2026 dominant pattern: hybrid vector + graph + short-term buffer. Mem0, Zep+Graphiti, MemGPT/Letta.',
      url: 'docs/research/memory.md',
      status: 'live'
    },
    {
      id: 'frameworks',
      label: 'Orchestration Frameworks',
      group: 5,
      desc: 'LlamaIndex (retrieval), LangGraph (stateful agents), Haystack (regulated), DSPy (optimization). 3.5–14ms overhead range.',
      url: 'docs/research/frameworks.md',
      status: 'live'
    },
    {
      id: 'combinations',
      label: 'System Combinations',
      group: 5,
      desc: 'Best-in-class stacks by use case: enterprise KB, customer support, code search, legal, PKM, healthcare, EPC.',
      url: 'docs/research/combinations.md',
      status: 'live'
    },
    {
      id: 'evaluation',
      label: 'Evaluation Frameworks',
      group: 5,
      desc: 'RAGAS (de facto standard), ARES (research), TruLens (production monitoring), DeepEval (CI/CD). Golden sets mandatory.',
      url: 'docs/research/evaluation.md',
      status: 'live'
    },
    // Personal context engine cluster — new research (coming soon)
    {
      id: 'personal-knowledge-base',
      label: 'Personal Knowledge Base',
      group: 6,
      desc: 'Efficient PKB design: Zettelkasten atomic notes, PARA, personal ontology, minimal viable knowledge graph.',
      url: 'docs/research/personal-knowledge-base.md',
      status: 'coming'
    },
    {
      id: 'karpathy-llm-os',
      label: 'Karpathy: LLM OS',
      group: 6,
      desc: 'LLM as operating system kernel: context window = RAM, weights = slow storage, tools = I/O. Personal AI workflows.',
      url: 'docs/research/karpathy-llm-os.md',
      status: 'coming'
    },
    {
      id: 'personal-context-engine',
      label: 'Personal Context Engine',
      group: 6,
      desc: 'How a personal context engine differs from ChatGPT. Persistent identity, personal ontology, temporal continuity.',
      url: 'docs/research/personal-context-engine.md',
      status: 'coming'
    },
  ],

  links: [
    // Index hub
    { source: 'index', target: 'overview' },
    { source: 'index', target: 'retrieval' },
    { source: 'index', target: 'indexing' },
    { source: 'index', target: 'reranking' },
    { source: 'index', target: 'graph-rag' },
    { source: 'index', target: 'memory' },
    { source: 'index', target: 'embeddings' },
    { source: 'index', target: 'vector-databases' },
    { source: 'index', target: 'frameworks' },
    { source: 'index', target: 'combinations' },
    { source: 'index', target: 'evaluation' },
    // Foundations
    { source: 'overview', target: 'retrieval' },
    { source: 'overview', target: 'indexing' },
    { source: 'overview', target: 'memory' },
    { source: 'overview', target: 'combinations' },
    // Retrieval cluster
    { source: 'retrieval', target: 'indexing' },
    { source: 'retrieval', target: 'reranking' },
    { source: 'retrieval', target: 'embeddings' },
    { source: 'retrieval', target: 'vector-databases' },
    { source: 'indexing', target: 'reranking' },
    { source: 'indexing', target: 'embeddings' },
    { source: 'reranking', target: 'embeddings' },
    { source: 'reranking', target: 'frameworks' },
    // Models + storage
    { source: 'embeddings', target: 'vector-databases' },
    // Advanced systems
    { source: 'graph-rag', target: 'retrieval' },
    { source: 'graph-rag', target: 'memory' },
    { source: 'graph-rag', target: 'vector-databases' },
    { source: 'graph-rag', target: 'combinations' },
    { source: 'memory', target: 'frameworks' },
    { source: 'memory', target: 'combinations' },
    // Application
    { source: 'frameworks', target: 'retrieval' },
    { source: 'frameworks', target: 'memory' },
    { source: 'frameworks', target: 'combinations' },
    { source: 'vector-databases', target: 'combinations' },
    { source: 'combinations', target: 'evaluation' },
    { source: 'evaluation', target: 'retrieval' },
    // Personal context cluster (new)
    { source: 'personal-knowledge-base', target: 'indexing' },
    { source: 'personal-knowledge-base', target: 'retrieval' },
    { source: 'personal-knowledge-base', target: 'memory' },
    { source: 'personal-knowledge-base', target: 'embeddings' },
    { source: 'personal-knowledge-base', target: 'graph-rag' },
    { source: 'karpathy-llm-os', target: 'memory' },
    { source: 'karpathy-llm-os', target: 'frameworks' },
    { source: 'karpathy-llm-os', target: 'personal-context-engine' },
    { source: 'karpathy-llm-os', target: 'personal-knowledge-base' },
    { source: 'personal-context-engine', target: 'personal-knowledge-base' },
    { source: 'personal-context-engine', target: 'karpathy-llm-os' },
    { source: 'personal-context-engine', target: 'memory' },
    { source: 'personal-context-engine', target: 'retrieval' },
    { source: 'personal-context-engine', target: 'combinations' },
    { source: 'personal-context-engine', target: 'overview' },
    { source: 'index', target: 'personal-knowledge-base' },
    { source: 'index', target: 'karpathy-llm-os' },
    { source: 'index', target: 'personal-context-engine' },
  ]
};

// ─────────────────────────────────────────────────────────────────
// Compute node degree (for sizing)
// ─────────────────────────────────────────────────────────────────
const degree = {};
graphData.nodes.forEach(n => { degree[n.id] = 0; });
graphData.links.forEach(l => {
  const s = typeof l.source === 'object' ? l.source.id : l.source;
  const t = typeof l.target === 'object' ? l.target.id : l.target;
  degree[s] = (degree[s] || 0) + 1;
  degree[t] = (degree[t] || 0) + 1;
});

// ─────────────────────────────────────────────────────────────────
// Build graph
// ─────────────────────────────────────────────────────────────────
const container = document.getElementById('graph');

const Graph = ForceGraph3D()(container)
  .backgroundColor('#0d1117')
  .graphData(graphData)
  // Nodes
  .nodeLabel(node => `<div style="
    background:rgba(13,17,23,0.9);
    border:1px solid rgba(48,54,61,0.8);
    border-radius:6px;
    padding:6px 10px;
    font-family:-apple-system,sans-serif;
    font-size:12px;
    font-weight:600;
    color:#e6edf3;
    white-space:nowrap;
    pointer-events:none;
  ">${node.label}${node.status === 'coming' ? ' <span style="color:#f0883e;font-size:10px;">[soon]</span>' : ''}</div>`)
  .nodeVal(node => Math.max(4, (degree[node.id] || 1) * 1.4))
  .nodeColor(node => {
    const c = COLORS[node.group];
    return node.status === 'coming' ? c + 'aa' : c;
  })
  .nodeResolution(16)
  // Links
  .linkColor(() => 'rgba(139,148,158,0.15)')
  .linkWidth(0.6)
  .linkDirectionalParticles(2)
  .linkDirectionalParticleWidth(1.2)
  .linkDirectionalParticleColor(link => {
    const s = typeof link.source === 'object' ? link.source.id : link.source;
    const srcNode = graphData.nodes.find(n => n.id === s);
    return srcNode ? COLORS[srcNode.group] + '88' : '#58a6ff44';
  })
  .linkDirectionalParticleSpeed(0.004)
  // Camera
  .cameraPosition({ x: 0, y: 0, z: 340 })
  // Click handler
  .onNodeClick(node => showPanel(node))
  .onBackgroundClick(() => closePanel());

// Enable slow auto-rotation
let rotating = true;
Graph.controls().autoRotate = true;
Graph.controls().autoRotateSpeed = 0.35;

// Stop rotation while hovering
Graph.onNodeHover(node => {
  container.style.cursor = node ? 'pointer' : 'default';
  if (node) { Graph.controls().autoRotate = false; }
  else if (!document.getElementById('infoPanel').classList.contains('visible')) {
    Graph.controls().autoRotate = true;
  }
});

// ─────────────────────────────────────────────────────────────────
// Info panel
// ─────────────────────────────────────────────────────────────────
const descriptions = {};
graphData.nodes.forEach(n => { descriptions[n.id] = n; });

function showPanel(node) {
  Graph.controls().autoRotate = false;
  const panel = document.getElementById('infoPanel');
  const tag = document.getElementById('infoTag');
  const title = document.getElementById('infoTitle');
  const desc = document.getElementById('infoDesc');
  const links = document.getElementById('infoLinks');
  const btn = document.getElementById('infoBtn');

  const categoryNames = ['Meta', 'Foundations', 'Retrieval Pipeline', 'Models & Storage', 'Advanced Systems', 'Application Layer', 'Personal Context'];

  tag.textContent = categoryNames[node.group] || '';
  tag.style.color = COLORS[node.group];

  title.textContent = node.label;
  desc.textContent = node.desc;

  // Count connections
  const conns = graphData.links.filter(l => {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    return s === node.id || t === node.id;
  }).length;
  links.innerHTML = `<span>${conns} connection${conns !== 1 ? 's' : ''}</span>`;

  if (node.status === 'coming') {
    btn.textContent = 'Research file coming soon';
    btn.classList.add('disabled');
    btn.removeAttribute('href');
  } else {
    btn.textContent = 'Open Research File →';
    btn.classList.remove('disabled');
    btn.href = node.url;
  }

  panel.classList.add('visible');
}

function closePanel() {
  document.getElementById('infoPanel').classList.remove('visible');
  Graph.controls().autoRotate = true;
}

// ─────────────────────────────────────────────────────────────────
// Stats overlay
// ─────────────────────────────────────────────────────────────────
const liveNodes = graphData.nodes.filter(n => n.status === 'live').length;
const totalNodes = graphData.nodes.length;
const totalLinks = graphData.links.length;
document.getElementById('stats').innerHTML =
  `<span>${liveNodes}</span> live files · <span>${totalNodes - liveNodes}</span> coming soon · <span>${totalLinks}</span> connections`;
document.getElementById('nodeCount').textContent =
  `${totalNodes} nodes · ${totalLinks} links`;

// ─────────────────────────────────────────────────────────────────
// Responsive resize
// ─────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  Graph.width(window.innerWidth);
  Graph.height(window.innerHeight);
});
</script>

</body>
</html>
